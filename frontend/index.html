var ans={};
var current=0;

function renderQ(index){
  var q=qs[index];
  var card=document.getElementById('qcard');
  if(!q)return;
  var html='<div class="q-num"><span>Q'+(index+1).toString().padStart(2,'0')+'</span><span class="qi">'+(index+1)+' / '+qs.length+'</span></div><div class="q-t">'+q.t+'</div>';
  for(var oi=0;oi<q.o.length;oi++){
    var sel=ans[index]===oi?' sel':'';
    html+='<button class="opt'+sel+'" data-q="'+index+'" data-o="'+oi+'"><span class="ol '+labelColors[oi]+'">'+labels[oi]+'</span>'+q.o[oi]+'</button>';
  }
  card.innerHTML=html;
  card.style.animation='none';
  setTimeout(function(){card.style.animation='fi .3s ease'},10);
  var btns=card.querySelectorAll('.opt');
  for(var bi=0;bi<btns.length;bi++){
    btns[bi].addEventListener('click',function(){
      var qi=parseInt(this.dataset.q),oi=parseInt(this.dataset.o);
      ans[qi]=oi;
      var all=this.parentElement.querySelectorAll('.opt');
      for(var ai=0;ai<all.length;ai++) all[ai].classList.remove('sel');
      this.classList.add('sel');
      up();
    });
  }
}

function up(){
  var d=0;for(var k in ans)d++;
  var t=qs.length,pct=d/t*100;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pl').textContent=d+'/'+t;
  document.getElementById('pp').textContent=Math.round(pct)+'%';
  document.getElementById('prev').classList.toggle('ok',current>0);
  var btn=document.getElementById('next');
  var sel=ans[current]!==undefined;
  btn.classList.toggle('ok',sel);
  if(sel&&current===qs.length-1){
    document.getElementById('ntxt').textContent='看看我是什么出生';
    document.getElementById('narrow').textContent='🎯';
    btn.onclick=submit;
  }else{
    document.getElementById('ntxt').textContent='下一题';
    document.getElementById('narrow').textContent='→';
    btn.onclick=nextQ;
  }
}

function prevQ(){
  if(current>0){
    current--;
    renderQ(current);
    up();
  }
}

function nextQ(){
  if(ans[current]===undefined)return;
  if(current<qs.length-1){
    current++;
    renderQ(current);
    up();
  }
}

function submit(){
  var d=0;for(var k in ans)d++;
  if(d<qs.length)return;
  var ap=0,rp=0,aCount=0,dCount=0;
  for(var i=0;i<qs.length;i++){
    var v=ans[i];
    if(v===0){ap+=3;aCount++;}
    else if(v===1)ap+=2;
    else if(v===2){ap+=1;rp+=1;} // C:温和计入两边
    else if(v===3)rp+=2;
    else if(v===4){rp+=3;dCount++;}
  }
  var max=45; // 15*3
  var ip=Math.round(Math.min(100,ap/max*100));
  var cp=Math.round(Math.min(100,rp/max*100));
  var ep=Math.round((aCount+dCount)/qs.length*100);
  var mp=Math.round(Math.min(aCount,dCount)*2/qs.length*100);
  var hp='';var bx=0,dx=0;
  for(var j=0;j<qs.length;j++){var v=ans[j];if(v===1)bx++;if(v===3)dx++;}
  // PURE: 极少极端，大量轻度的B/D
  if(aCount+dCount<=2&&bx+dx>=9)hp='pure';
  // RAT: 大量B(讨好型)
  else if(bx>=7&&dCount<=2&&aCount<=2)hp='rat';
  // LIMBO: A和E平衡矛盾
  else if(aCount>=4&&dCount>=4&&mp>=40)hp='limbo';
  window.location.href='result.html?i='+ip+'&c='+cp+'&e='+ep+'&m='+mp+(hp?'&h='+hp:'')+'&a='+Object.values(ans).join(',');
}

document.getElementById('prev').addEventListener('click',prevQ);
renderQ(0);
up();
</script>
</body>
</html>
