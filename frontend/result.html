    for(var t=0;t<TT.length;t++) if(TT[t].S[0]==='H'&&TT[t].m(i,c,h)) return TT[t];
  }
  // 特殊极端优先
  for(var t=0;t<TT.length;t++){
    if(TT[t].S[0]==='X'&&TT[t].m(i,c)) return TT[t];
  }
  // 主线S/E/N匹配
  for(t=0;t<TT.length;t++){
    if(TT[t].S[0]!=='X'&&TT[t].S[0]!=='H'&&TT[t].m(i,c)) return TT[t];
  }
  // 兜底:最近邻
  var grid={S1:[33,25],S2:[25,45],S3:[25,65],S4:[25,83],E1:[42,22],E2:[42,42],E3:[55,22],E4:[70,22],N1:[44,44],N2:[48,52],N3:[57,57],N4:[68,55]};
  var b=TT[0],bd=Infinity;
  for(t=0;t<TT.length;t++){
    if(TT[t].S[0]==='X'||TT[t].S[0]==='H')continue;
    var ci=grid[TT[t].S]||[50,50];
    var d=Math.sqrt((i-ci[0])*(i-ci[0])+(c-ci[1])*(c-ci[1]));
    if(d<bd){bd=d;b=TT[t];}
  }
  return b;
}
